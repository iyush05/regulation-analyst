# Render blueprint for the backend API, on the free instance type.
# Free instances have no persistent disk: on every restart (including the spin-down after
# 15 idle minutes) the database is re-seeded from deploy/seed.sqlite3, and companies ingested
# on the server since are lost. Refresh the seed with scripts/snapshot_seed.py and push. For a lasting database, use plan: starter and add:
#   disk: { name: data, mountPath: /data, sizeGB: 5 }
services:
  - type: web
    name: regulation-analyst-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REGULATION_API_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: REGULATION_AGENT_MODEL
        value: gpt-4.1
      - key: REGULATION_CORS_ORIGINS
        sync: false
      # Configure REGULATION_MCP_TOKENS manually in the Render dashboard to enable /mcp/.
      # Keep it separate from REGULATION_API_TOKEN. See docs/AGENSI_SETUP.md.
      - key: REGULATION_MCP_REQUESTS_PER_MINUTE
        value: "120"
