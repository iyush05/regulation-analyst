[build-system]
requires = ["setuptools>=82,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "regulation-analyst"
version = "0.2.0"
description = "Source-backed research on Indian company financials and dated regulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "mcp>=1.29,<2", "pymupdf>=1.27,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
local-search = ["sentence-transformers>=5.2,<6"]

[project.scripts]
regulation-analyst = "regulation_analyst.cli:main"

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regulation_analyst = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
